name: Build Agent-To WordPress Plugin

on:
  push:
    branches:
      - main
    paths:
      - "wordpress-plugin/agent-to/**"
      - ".github/workflows/build-wordpress-plugin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin PHP syntax
        run: php -l wordpress-plugin/agent-to/agent-to.php

      - name: Build installable ZIP
        run: |
          cd wordpress-plugin
          zip -r ../agent-to-wordpress-plugin.zip agent-to

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: agent-to-wordpress-plugin-2.8.0
          path: agent-to-wordpress-plugin.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish public plugin release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: Agent-To WordPress Plugin v2.8.0
          body: |
            Agent-To WordPress plugin with automatic WooCommerce/product detection and catalog sync to Agent-To.
            Install this ZIP through WordPress Plugins > Add New > Upload Plugin.
          files: agent-to-wordpress-plugin.zip
          make_latest: true
